<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全港交通到站預報器 (九巴+城巴+港鐵)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kmbRed: '#ef4444',
                        ctbYellow: '#facc15',
                        ctbBlue: '#1e3a8a',
                        mtrRed: '#991b1e',
                        darkbg: '#121212',
                        panelbg: '#1e1e1e',
                        cardbg: '#242424'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; background-color: #000; color: #fff; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        
        .checkbox-custom:checked + div { border-color: #ef4444; background-color: rgba(239, 68, 68, 0.1); }
        .checkbox-custom.KMB:checked + div { border-color: #ef4444; background-color: rgba(239, 68, 68, 0.1); }
        .checkbox-custom.KMB:checked + div .check-icon { color: #ef4444; opacity: 1; transform: scale(1); }
        .checkbox-custom.CTB:checked + div { border-color: #facc15; background-color: rgba(250, 204, 21, 0.1); }
        .checkbox-custom.CTB:checked + div .check-icon { color: #facc15; opacity: 1; transform: scale(1); }
        .checkbox-custom.MTR:checked + div { border-color: #991b1e; background-color: rgba(153, 27, 30, 0.2); }
        .checkbox-custom.MTR:checked + div .check-icon { color: #991b1e; opacity: 1; transform: scale(1); }
        .check-icon { opacity: 0; transform: scale(0.5); transition: all 0.2s ease-in-out; }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -10px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -10px); }
        }
        .animate-fade-in-out { animation: fadeInOut 3s forwards; }
    </style>
</head>
<body class="antialiased overflow-hidden selection:bg-gray-700">

    <div class="max-w-md mx-auto h-[100dvh] flex flex-col bg-darkbg relative shadow-2xl border-x border-gray-900">
        
        <!-- Header -->
        <header class="bg-panelbg border-b border-gray-800 px-4 py-3 flex justify-between items-center sticky top-0 z-20 shrink-0">
            <div class="flex items-center gap-2">
                <div id="header-icon" class="w-8 h-8 rounded-lg bg-gray-700 flex items-center justify-center shadow-inner transition-colors">
                    <span class="text-white text-lg leading-none">🚌</span>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-lg font-bold text-white leading-tight">交通到站預報</h1>
                    <span id="company-badge" class="text-[10px] bg-gray-700 text-gray-300 px-1.5 py-0.5 rounded w-fit hidden">未設定</span>
                </div>
            </div>
            <button id="toggle-settings-btn" class="p-2 rounded-full hover:bg-gray-700 transition-colors bg-gray-800">
                ⚙️
            </button>
        </header>

        <!-- 天氣資訊列 -->
        <div id="weather-banner" class="bg-darkbg border-b border-gray-800 px-4 py-2 flex flex-col gap-1.5 text-xs shrink-0 z-20 hidden shadow-md">
            <div class="flex justify-between items-center text-gray-300">
                <div class="flex items-center gap-4">
                    <span id="weather-temp" class="font-bold text-white flex items-center gap-1.5 text-sm">🌡️ --°C</span>
                    <span id="weather-rh" class="font-medium text-blue-300 flex items-center gap-1.5 text-sm">💧 --%</span>
                </div>
                <span class="text-[10px] text-gray-500 bg-gray-800 px-1.5 py-0.5 rounded">香港天文台即時數據</span>
            </div>
            <div id="weather-warnings-container" class="flex flex-col gap-1.5 mt-1 hidden"></div>
            <div id="special-weather-tips" class="bg-yellow-900/20 border border-yellow-700/50 text-yellow-400 mt-1 px-3 py-2 rounded-lg hidden flex-col gap-1"></div>
        </div>

        <!-- 主頁面：預報面板 -->
        <section id="view-eta" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 relative">
            <div id="setup-prompt" class="flex flex-col items-center justify-center h-full text-center text-gray-500 hidden">
                <span class="text-4xl mb-3">🛠️</span>
                <p class="mb-4">尚未設定站點資訊</p>
                <button id="go-to-settings-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-full font-medium transition">
                    立即設定
                </button>
            </div>
            <div id="eta-list" class="flex flex-col gap-4 pb-20"></div>
            <div id="main-loader" class="absolute inset-0 bg-darkbg/80 backdrop-blur-sm flex flex-col items-center justify-center hidden z-10">
                <div class="animate-spin rounded-full h-10 w-10 border-4 border-gray-600 border-t-white mb-3"></div>
                <p class="text-sm text-gray-300 animate-pulse">正在獲取實時數據...</p>
            </div>
        </section>

        <!-- 設定頁面 -->
        <section id="view-settings" class="flex-1 overflow-y-auto p-4 flex flex-col bg-darkbg hidden pb-24">
            <div class="mb-4">
                <h2 class="text-2xl font-bold text-white mb-1">站點與路線設定</h2>
                <p class="text-xs text-gray-400">支援九巴 (KMB)、城巴 (CTB) 及 港鐵 (MTR)。</p>
            </div>

            <div id="bookmarks-section" class="mb-6 hidden">
                <h3 class="text-sm font-medium text-gray-400 mb-2">⭐ 我的最愛站點</h3>
                <div id="bookmarks-list" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="bg-panelbg rounded-xl p-4 border border-gray-800 mb-6 shadow-lg">
                <div class="flex gap-2 mb-4 bg-gray-800 p-1 rounded-lg">
                    <button id="tab-search-stop" class="flex-1 py-1.5 text-sm font-bold rounded bg-gray-600 text-white transition-all shadow">🔍 找車站</button>
                    <button id="tab-search-route" class="flex-1 py-1.5 text-sm font-bold rounded text-gray-400 hover:text-white transition-all">🚌 找路線</button>
                </div>

                <h3 id="search-title" class="block text-sm font-medium text-gray-300 mb-2">第一步：尋找車站 (中英文皆可)</h3>
                <div class="flex gap-2">
                    <input type="text" id="stop-name-search" placeholder="例如: 旺角, 觀塘" 
                        class="flex-1 bg-darkbg border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-gray-500 transition-all font-sans text-sm">
                    <button id="search-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-3 rounded-lg transition-colors min-w-[80px]">
                        搜尋
                    </button>
                </div>
                <div id="search-msg" class="text-xs mt-2 hidden"></div>
                <!-- 注意：移除了 Flex 防止擠壓，改用 Grid -->
                <div id="stop-search-results" class="mt-3 grid gap-2 max-h-[300px] overflow-y-auto pr-1"></div>
            </div>

            <input type="hidden" id="stop-id-input">
            <input type="hidden" id="company-input">

            <div id="route-selection-area" class="hidden flex-col gap-3">
                <div class="flex justify-between items-end border-b border-gray-800 pb-2 mb-1">
                    <h3 class="text-sm font-medium text-gray-300">📍 第二步：選擇要顯示的路線</h3>
                    <span id="route-count" class="text-xs text-gray-500"></span>
                </div>
                <div id="routes-checkbox-list" class="grid gap-2 max-h-[400px] overflow-y-auto pr-1"></div>
            </div>

            <div id="save-settings-area" class="hidden mt-6">
                <button id="save-settings-btn" class="w-full bg-white text-black hover:bg-gray-200 font-bold py-3.5 rounded-xl transition-colors shadow-lg active:scale-[0.98]">
                    💾 儲存並查看預報
                </button>
            </div>
        </section>

        <!-- 底部狀態列 -->
        <footer id="status-footer" class="bg-panelbg border-t border-gray-800 p-3 flex justify-between items-center shrink-0 z-20">
            <div class="flex items-center gap-2">
                <div id="status-indicator" class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
                <span class="text-xs text-gray-400">最後更新: <span id="last-update-time" class="text-white font-mono">--:--:--</span></span>
            </div>
            <div class="flex items-center gap-3">
                <span id="countdown-text" class="text-xs font-mono text-gray-400">30s</span>
                <button id="refresh-btn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-1.5 rounded text-xs transition-colors border border-gray-700">
                    🔄 手動更新
                </button>
            </div>
        </footer>
    </div>

                ["STW","沙田圍","Sha Tin Wai",["TML"]], ["CIO","第一城","City One",["TML"]], ["SHM","石門","Shek Mun",["TML"]], ["TSH","大水坑","Tai Shui Hang",["TML"]],

                ["WCH","黃竹坑","Wong Chuk Hang",["SIL"]], ["LET","利東","Lei Tung",["SIL"]], ["SOH","海怡半島","South Horizons",["SIL"]], ["DIS","迪士尼","Disneyland Resort",["DRL"]]

            function getMTRStationName(code) {
                const s = MTR_DATA.find(x => x[0] === code);
                return s ? s[1] : code;
            }

            const viewEta = document.getElementById('view-eta');
            const viewSettings = document.getElementById('view-settings');
            const toggleSettingsBtn = document.getElementById('toggle-settings-btn');
            const setupPrompt = document.getElementById('setup-prompt');
            const saveSettingsBtn = document.getElementById('save-settings-btn');
            const stopNameSearch = document.getElementById('stop-name-search');
            const searchBtn = document.getElementById('search-btn');
            const stopSearchResults = document.getElementById('stop-search-results');
            const searchMsg = document.getElementById('search-msg');
            const routeSelectionArea = document.getElementById('route-selection-area');
            const routesCheckboxList = document.getElementById('routes-checkbox-list');
            const routeCount = document.getElementById('route-count');
            const saveSettingsArea = document.getElementById('save-settings-area');
            const stopIdInput = document.getElementById('stop-id-input');
            const companyInput = document.getElementById('company-input');
            const bookmarksSection = document.getElementById('bookmarks-section');
            const bookmarksList = document.getElementById('bookmarks-list');
            const etaList = document.getElementById('eta-list');
            const mainLoader = document.getElementById('main-loader');
            const headerIcon = document.getElementById('header-icon');
            const companyBadge = document.getElementById('company-badge');
            const countdownText = document.getElementById('countdown-text');
            const lastUpdateTime = document.getElementById('last-update-time');
            const refreshBtn = document.getElementById('refresh-btn');
            const statusIndicator = document.getElementById('status-indicator');
            const statusFooter = document.getElementById('status-footer');
            
            const weatherBanner = document.getElementById('weather-banner');
            const weatherTemp = document.getElementById('weather-temp');
            const weatherRh = document.getElementById('weather-rh');
            const weatherWarningsContainer = document.getElementById('weather-warnings-container');
            const specialWeatherTips = document.getElementById('special-weather-tips');
            
            const tabSearchStop = document.getElementById('tab-search-stop');
            const tabSearchRoute = document.getElementById('tab-search-route');
            const searchTitle = document.getElementById('search-title');

            function showToast(msg) {
                const toast = document.createElement('div');
                toast.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-xl z-50 text-sm border border-gray-700 animate-fade-in-out';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            tabSearchStop.addEventListener('click', () => {
                searchMode = 'stop';
                tabSearchStop.className = 'flex-1 py-1.5 text-sm font-bold rounded bg-gray-600 text-white transition-all shadow';
                tabSearchRoute.className = 'flex-1 py-1.5 text-sm font-bold rounded text-gray-400 hover:text-white transition-all';
                searchTitle.textContent = '第一步：尋找車站 (中英文皆可)';
                stopNameSearch.placeholder = '例如: 旺角, 觀塘';
                stopNameSearch.value = '';
                stopSearchResults.innerHTML = '';
                searchMsg.classList.add('hidden');
            });

            tabSearchRoute.addEventListener('click', () => {
                searchMode = 'route';
                tabSearchRoute.className = 'flex-1 py-1.5 text-sm font-bold rounded bg-gray-600 text-white transition-all shadow';
                tabSearchStop.className = 'flex-1 py-1.5 text-sm font-bold rounded text-gray-400 hover:text-white transition-all';
                searchTitle.textContent = '第一步：輸入巴士號碼 (例如: 1A, 962X)';
                stopNameSearch.placeholder = '輸入號碼...';
                stopNameSearch.value = '';
                stopSearchResults.innerHTML = '';
                searchMsg.classList.add('hidden');
            });

            function init() {
                loadConfig();
                loadBookmarks();
                fetchWeather();
                setInterval(fetchWeather, 5 * 60 * 1000);
                
                if (appConfig.stopId && appConfig.routes.length > 0) {
                    showView('eta');
                    updateHeaderTheme();
                    loadETA();
                    startTimer();
                } else {
                    showView('settings');
                }
            }

            function loadConfig() {
                try {
                    const saved = localStorage.getItem('bus-eta-config');
                    if (saved) appConfig = JSON.parse(saved);
                } catch (e) {}
            }

            function loadBookmarks() {
                try {
                    const saved = localStorage.getItem('bus-eta-bookmarks');
                    if (saved) bookmarks = JSON.parse(saved);
                } catch (e) {}
                renderBookmarks();
            }

            function saveBookmarks() {
                localStorage.setItem('bus-eta-bookmarks', JSON.stringify(bookmarks));
                renderBookmarks();
            }

            function showView(view) {
                if (view === 'eta') {
                    viewSettings.classList.add('hidden');
                    if (appConfig.stopId) {
                        viewEta.classList.remove('hidden');
                        setupPrompt.classList.add('hidden');
                        statusFooter.classList.remove('hidden');
                    } else {
                        viewEta.classList.remove('hidden');
                        setupPrompt.classList.remove('hidden');
                        etaList.innerHTML = '';
                        statusFooter.classList.add('hidden');
                    }
                    toggleSettingsBtn.innerHTML = '⚙️';
                } else {
                    viewSettings.classList.remove('hidden');
                    viewEta.classList.add('hidden');
                    statusFooter.classList.add('hidden');
                    toggleSettingsBtn.innerHTML = '✕';
                }
            }

            async function fetchWeather() {
                try {
                    const weatherRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                    if (weatherRes.ok) {
                        const weatherData = await weatherRes.json();
                        if (weatherData.temperature && weatherData.temperature.data) {
                            const hkoTemp = weatherData.temperature.data.find(t => t.place === '香港天文台') || weatherData.temperature.data[0];
                            if (hkoTemp) weatherTemp.innerHTML = `🌡️ ${Math.round(Number(hkoTemp.value))}°C`;
                        }
                        if (weatherData.humidity && weatherData.humidity.data && weatherData.humidity.data.length > 0) {
                            weatherRh.innerHTML = `💧 ${Math.round(Number(weatherData.humidity.data[0].value))}%`;
                        }
                        if (weatherData.specialWxTips && weatherData.specialWxTips.length > 0) {
                            specialWeatherTips.innerHTML = weatherData.specialWxTips.map(tip => 
                                `<div class="flex items-start gap-2"><span class="shrink-0 mt-0.5">⚠️</span><span class="leading-relaxed text-xs">${tip}</span></div>`
                            ).join('');
                            specialWeatherTips.classList.remove('hidden');
                            specialWeatherTips.classList.add('flex');
                        } else {
                            specialWeatherTips.classList.add('hidden');
                            specialWeatherTips.classList.remove('flex');
                        }
                        weatherBanner.classList.remove('hidden');
                    }
                    const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                    if (warnRes.ok) {
                        const warnText = await warnRes.text();
                        weatherWarningsContainer.innerHTML = '';
                        if (warnText.trim() !== '') {
                            const warnData = JSON.parse(warnText);
                            const warnKeys = Object.keys(warnData);
                            if (warnKeys.length > 0) {
                                warnKeys.forEach(key => {
                                    const warning = warnData[key];
                                    const warnEl = document.createElement('div');
                                    warnEl.className = 'bg-red-900/40 border border-red-500 text-red-100 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm flex items-center gap-2';
                                    warnEl.innerHTML = `<span class="animate-pulse text-base leading-none">🚨</span><span>${warning.name}</span>`;
                                    weatherWarningsContainer.appendChild(warnEl);
                                });
                                weatherWarningsContainer.classList.remove('hidden');
                            } else weatherWarningsContainer.classList.add('hidden');
                        } else weatherWarningsContainer.classList.add('hidden');
                    }
                } catch (e) { console.error(e); }
            }

            async function searchStops(keyword) {
                if (!keyword) return;
                
                if (searchMode === 'route') {
                    searchRoutesByNumber(keyword);
                    return;
                }

                showSearchMsg('正在全港資料庫搜尋中...', 'text-blue-400');
                
                try {
                    if (allStopsCache.length === 0) {
                        let kmbStops = [], ctbStops = [];
                        
                        const kmbRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop').catch(()=>null);
                        if (kmbRes && kmbRes.ok) {
                            const kmbJson = await kmbRes.json();
                            if (kmbJson && Array.isArray(kmbJson.data)) {
                                kmbStops = kmbJson.data.map(s => ({ id: s.stop, name_tc: s.name_tc, name_en: s.name_en, company: 'KMB' }));
                            }
                        }

                        const ctbRes = await fetch('https://rt.data.gov.hk/v2/transport/citybus/stop').catch(()=>null);
                        if (ctbRes && ctbRes.ok) {
                            const ctbJson = await ctbRes.json();
                            if (ctbJson && Array.isArray(ctbJson.data)) {
                                ctbStops = ctbJson.data.map(s => ({ id: s.stop, name_tc: s.name_tc, name_en: s.name_en, company: 'CTB' }));
                            }
                        }

                        let mtrStops = MTR_DATA.map(s => ({ id: s[0], name_tc: s[1], name_en: s[2], company: 'MTR' }));
                        allStopsCache = [...mtrStops, ...kmbStops, ...ctbStops];
                    }

                    const kw = keyword.toLowerCase();
                    let results = allStopsCache.filter(s => 
                        (s.name_tc && s.name_tc.includes(kw)) || 
                        (s.name_en && s.name_en.toLowerCase().includes(kw)) ||
                        (kw === '港鐵' && s.company === 'MTR')
                    );

                    results.sort((a, b) => {
                        const exactA = (a.name_tc === kw) ? 1 : 0;
                        const exactB = (b.name_tc === kw) ? 1 : 0;
                        if (exactA !== exactB) return exactB - exactA;
                        if (a.company === 'MTR' && b.company !== 'MTR') return -1;
                        if (a.company !== 'MTR' && b.company === 'MTR') return 1;
                        return 0;
                    });

                    if (results.length === 0) {
                        showSearchMsg('找不到相符的車站，請嘗試其他關鍵字。', 'text-yellow-400');
                        stopSearchResults.innerHTML = '';
                    } else {
                        showSearchMsg(`找到 ${results.length} 個結果。`, 'text-green-400');
                        renderStopSearchResults(results);
                    }
                } catch (error) {
                    showSearchMsg('搜尋時發生錯誤。', 'text-red-400');
                }
            }

            async function searchRoutesByNumber(keyword) {
                showSearchMsg('正在全港路線庫搜尋中...', 'text-blue-400');
                try {
                    if (allRoutesCache.length === 0) {
                        const kmbRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/').catch(()=>null);
                        if (kmbRes && kmbRes.ok) {
                            const kmbJson = await kmbRes.json();
                            if (kmbJson && Array.isArray(kmbJson.data)) {
                                kmbJson.data.forEach(r => {
                                    if(r.route) allRoutesCache.push({ company: 'KMB', route: r.route, orig: r.orig_tc, dest: r.dest_tc, bound: r.bound });
                                });
                            }
                        }
                        const ctbRes = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route/CTB').catch(()=>null);
                        if (ctbRes && ctbRes.ok) {
                            const ctbJson = await ctbRes.json();
                            if (ctbJson && Array.isArray(ctbJson.data)) {
                                ctbJson.data.forEach(r => {
                                    if(r.route) {
                                        allRoutesCache.push({ company: 'CTB', route: r.route, orig: r.orig_tc, dest: r.dest_tc, bound: 'outbound' });
                                        allRoutesCache.push({ company: 'CTB', route: r.route, orig: r.dest_tc, dest: r.orig_tc, bound: 'inbound' });
                                    }
                                });
                            }
                        }
                    }

                    const kw = keyword.toUpperCase();
                    let matchedRoutes = allRoutesCache.filter(r => r.route && r.route.toUpperCase().includes(kw));

                    if (matchedRoutes.length === 0) {
                        showSearchMsg('找不到相符的路線號碼。', 'text-yellow-400');
                        stopSearchResults.innerHTML = '';
                    } else {
                        showSearchMsg(`找到 ${matchedRoutes.length} 個方向的路線。請點擊路線查看沿途車站。`, 'text-green-400');
                        stopSearchResults.innerHTML = '';
                        
                        matchedRoutes.slice(0, 50).forEach(rt => {
                            if (!rt.route) return;
                            
                            const div = document.createElement('div');
                            let badgeClass = rt.company === 'KMB' ? 'bg-red-900 text-red-200' : 'bg-yellow-900 text-yellow-400';
                            let dirText = (rt.bound === 'I' || rt.bound === 'inbound') ? '回程 (Inbound)' : '去程 (Outbound)';
                            let safeRoute = rt.route;
                            let safeOrig = rt.orig || '總站';
                            let safeDest = rt.dest || '總站';

                            div.className = 'flex flex-col shrink-0 bg-darkbg p-3 rounded-lg border border-gray-700 hover:border-gray-500 transition-colors gap-2 cursor-pointer relative overflow-hidden';
                            // 修正：將目的地 (safeDest) 傳遞給下一步，保留路線記憶
                            div.onclick = () => window.fetchStopsForRoute(rt.company, safeRoute, rt.bound, safeDest);
                            div.innerHTML = `
                                <div class="absolute top-0 right-0 bg-gray-800 text-gray-400 text-[10px] px-2 py-1 rounded-bl-lg font-bold">${dirText}</div>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-xs px-1.5 py-0.5 rounded ${badgeClass}">${rt.company}</span>
                                    <span class="font-black text-white text-lg">${safeRoute}</span>
                                </div>
                                <div class="text-sm text-gray-300 font-medium">${safeOrig} <span class="text-gray-500 mx-1">➔</span> ${safeDest}</div>
                            `;
                            stopSearchResults.appendChild(div);
                        });
                    }
                } catch (e) { showSearchMsg('獲取路線資料失敗。', 'text-red-400'); }
            }

            // 修正：接收 dest 參數，並建立 routeContext 路線記憶
            window.fetchStopsForRoute = async function(company, route, bound = null, dest = null) {
                showSearchMsg(`正在獲取 ${company} ${route} 沿途車站... 這可能需要幾秒鐘`, 'text-blue-400');
                stopSearchResults.innerHTML = '';
                
                let routeContext = { route: route, dir: bound, dest: dest || '(目的地)', company: company };

                try {
                    let stopIds = [];
                    if (company === 'KMB') {
                        let dir = bound === 'I' ? 'inbound' : 'outbound';
                        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${dir}/1`).catch(()=>null);
                        if (res && res.ok) {
                            let j = await res.json();
                            if (j && Array.isArray(j.data)) stopIds = j.data.map(s => s.stop);
                        }
                    } else if (company === 'CTB') {
                        let dir = bound || 'outbound';
                        const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route}/${dir}`).catch(()=>null);
                        if (res && res.ok) {
                            let j = await res.json();
                            if (j && Array.isArray(j.data)) stopIds = j.data.map(s => s.stop);
                        }
                    }
                    
                    if (stopIds.length === 0) {
                        showSearchMsg(`找不到 ${route} 的車站資料，可能該方向暫無服務。`, 'text-yellow-400'); return;
                    }
                    
                    stopIds = [...new Set(stopIds)];
                    let routeStops = [];
                    
                    for (let id of stopIds) {
                        let cached = allStopsCache.find(s => s.id === id);
                        if (cached) {
                            routeStops.push(cached);
                        } else {
                            if (company === 'CTB') {
                                const sRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${id}`).catch(()=>null);
                                if (sRes && sRes.ok) {
                                    const sJson = await sRes.json();
                                    if (sJson && sJson.data) {
                                        const sd = { id: sJson.data.stop, name_tc: sJson.data.name_tc, name_en: sJson.data.name_en, company: 'CTB' };
                                        routeStops.push(sd); allStopsCache.push(sd);
                                    }
                                }
                            } else if (company === 'KMB') {
                                const sRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${id}`).catch(()=>null);
                                if (sRes && sRes.ok) {
                                    const sJson = await sRes.json();
                                    if (sJson && sJson.data) {
                                        const sd = { id: sJson.data.stop, name_tc: sJson.data.name_tc, name_en: sJson.data.name_en, company: 'KMB' };
                                        routeStops.push(sd); allStopsCache.push(sd);
                                    }
                                }
                            }
                        }
                    }
                    
                    if(routeStops.length === 0) {
                        showSearchMsg(`無法獲取 ${route} 的車站詳細名稱，請稍後再試。`, 'text-red-400');
                    } else { 
                        showSearchMsg(`找到 ${routeStops.length} 個沿途車站。請選擇你的上車地點：`, 'text-green-400'); 
                        // 修正：將 routeContext 傳遞給渲染函數
                        renderStopSearchResults(routeStops, routeContext); 
                    }
                } catch(e) { 
                    showSearchMsg('獲取車站資料時發生網絡錯誤。', 'text-red-400'); 
                }
            }

            function showSearchMsg(msg, colorClass) {

            // 修正：接收 routeContext，並將其編碼後綁定到按鈕中

            // 修正：儲存我的最愛時一併記憶 contextStr

                    `;

            // 修正：智能判斷是否有路線記憶 (contextStr)
            window.selectStopFromSearch = async function(id, company, name, contextStr = '') {
                stopIdInput.value = id;
                companyInput.value = company;
                
                stopSearchResults.innerHTML = '';
                searchMsg.classList.add('hidden');
                routeSelectionArea.classList.add('hidden');
                saveSettingsArea.classList.add('hidden');
                showSearchMsg(`正在獲取「${name}」的路線...`, 'text-blue-400');
                
                tempAvailableRoutes = [];
                
                // 如果是從「找路線」過來的，直接使用記憶好的路線，瞬間完成！
                if (contextStr) {
                    try {
                        const routeObj = JSON.parse(decodeURIComponent(contextStr));
                        tempAvailableRoutes = [routeObj];
                        finishRouteSetup(company, name);
                        return;
                    } catch (e) { console.error('Context Parse Error', e); }
                }

                if (company === 'MTR') {
                    const mtrRoutes = [];
                    const sta = MTR_DATA.find(s => s[0] === id);
                    if (sta) {
                        sta[3].forEach(line => {
                            const info = MTR_LINE_INFO[line];
                            if(!info) return;

                            if (id !== info.up && id !== info.up2) {
                                let destName = getMTRStationName(info.up);
                                if (info.up2) destName += ' / ' + getMTRStationName(info.up2);
                                mtrRoutes.push({ route: line, routeName: info.n, dest: destName, dir: 'UP', color: info.c });
                            }
                            if (id !== info.dn) {
                                let destName = getMTRStationName(info.dn);
                                mtrRoutes.push({ route: line, routeName: info.n, dest: destName, dir: 'DOWN', color: info.c });
                            }
                        });
                    }
                    tempAvailableRoutes = mtrRoutes;
                    finishRouteSetup(company, name);
                    return;
                }

                if (company === 'CTB') {
                    showSearchMsg('⚠️ 城巴站點請透過「找路線」功能來選擇你要的巴士號碼。', 'text-yellow-400');
                    return;
                }

                try {
                    let url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${id}`;
                        
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('API Error');
                    const json = await res.json();
                    
                    if (json && Array.isArray(json.data)) {
                        const uniqueMap = new Map();
                        json.data.forEach(item => {
                            const route = item.route;
                            const dir = item.dir;
                            const dest = item.dest_tc || item.dest_en || '終點站';
                            const key = `${route}-${dir}`;
                            if (!uniqueMap.has(key)) {
                                uniqueMap.set(key, { route, dir, dest });
                            }
                        });
                        tempAvailableRoutes = Array.from(uniqueMap.values());
                        
                        tempAvailableRoutes.sort((a, b) => {
                            const numA = parseInt(a.route.replace(/\D/g, '')) || 0;
                            const numB = parseInt(b.route.replace(/\D/g, '')) || 0;
                            if (numA !== numB) return numA - numB;
                            return a.route.localeCompare(b.route);
                        });
                    }
                    
                    if (tempAvailableRoutes.length === 0) {
                        showSearchMsg('該站點目前沒有路線資料。', 'text-yellow-400');
                        return;
                    }

                    finishRouteSetup(company, name);

                } catch (e) {
                    console.error('Route fetch error:', e);
                    showSearchMsg('獲取路線失敗，請重試。', 'text-red-400');
                }
            };

            function finishRouteSetup(company, name) {
                renderRouteCheckboxes(tempAvailableRoutes, company);
                routeCount.textContent = `共 ${tempAvailableRoutes.length} 個方向`;
                routeSelectionArea.classList.remove('hidden');
                routeSelectionArea.classList.add('flex');
                saveSettingsArea.classList.remove('hidden');
                showSearchMsg(`成功獲取路綫，請勾選要關注的方向。`, 'text-green-400');
                setTimeout(() => { routeSelectionArea.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200);
                appConfig.stopName = name;
            }

            function renderRouteCheckboxes(routes, company) {
                routesCheckboxList.innerHTML = '';
                
                routes.forEach((rt, index) => {
                    const uniqueId = `route-chk-${index}`;
                    const val = rt.dir ? `${rt.route}|${rt.dir}|${rt.dest}` : `${rt.route}|${rt.dest}`;
                    
                    const isChecked = (appConfig.stopId === stopIdInput.value && appConfig.company === company && appConfig.routes.some(r => r.route === rt.route && (rt.dir ? r.dir === rt.dir : r.dest === rt.dest))) ? 'checked' : '';

                    const label = document.createElement('label');
                    label.className = 'block relative cursor-pointer group shrink-0';
                    
                    const routeDisplay = rt.routeName || rt.route;
                    const badgeStyle = rt.color ? `background-color:${rt.color}; color:white;` : `background-color:white; color:black;`;

                    label.innerHTML = `
                        <input type="checkbox" class="checkbox-custom ${company} absolute opacity-0 w-0 h-0" id="${uniqueId}" value="${val}" ${isChecked}>
                        <div class="flex justify-between items-center bg-cardbg border border-gray-700 rounded-lg p-3 transition-all">
                            <div class="flex items-center gap-3">
                                <span class="font-black text-lg px-2 rounded min-w-[3rem] text-center shadow-sm" style="${badgeStyle}">${routeDisplay}</span>
                                <div class="flex flex-col">
                                    <span class="text-[10px] text-gray-400 leading-none mb-1">往</span>
                                    <span class="text-sm font-medium text-white leading-none">${rt.dest}</span>
                                </div>
                            </div>
                            <svg class="check-icon w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    `;
                    routesCheckboxList.appendChild(label);
                });
            }

            saveSettingsBtn.addEventListener('click', () => {
                const checkboxes = routesCheckboxList.querySelectorAll('input[type="checkbox"]:checked');
                if (checkboxes.length === 0) {
                    showToast('請至少選擇一條路線！');
                    return;
                }

                const selectedRoutes = Array.from(checkboxes).map(cb => {
                    const parts = cb.value.split('|');
                    if (parts.length === 3) {
                        return { route: parts[0], dir: parts[1], dest: parts[2] };
                    }
                    return { route: parts[0], dest: parts[1] };
                });

                appConfig.stopId = stopIdInput.value;
                appConfig.company = companyInput.value;
                appConfig.routes = selectedRoutes;
                
                localStorage.setItem('bus-eta-config', JSON.stringify(appConfig));
                
                updateHeaderTheme();
                showView('eta');
                loadETA();
                startTimer();
            });

            async function loadETA() {
                if (!appConfig.stopId || appConfig.routes.length === 0) return;
                
                mainLoader.classList.remove('hidden');
                statusIndicator.classList.replace('bg-green-500', 'bg-yellow-500');

                try {
                    let groupedData = [];
                    const now = new Date();

                    if (appConfig.company === 'MTR') {
                        const uniqueLines = [...new Set(appConfig.routes.map(r => r.route))];
                        const promises = uniqueLines.map(line => 
                            fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${appConfig.stopId}`)
                            .then(res => res.json())
                            .catch(e => null)
                        );
                        const results = await Promise.all(promises);
                        groupedData = processETADataMTR(results, appConfig, now);
                        
                    } else if (appConfig.company === 'CTB') {
                        // 修正：城巴必須逐條路線請求 ETA
                        const promises = appConfig.routes.map(r => 
                            fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${appConfig.stopId}/${r.route}`)
                            .then(res => res.ok ? res.json() : null)
                            .catch(() => null)
                        );
                        const results = await Promise.all(promises);
                        let allData = [];
                        results.forEach(res => {
                            if (res && Array.isArray(res.data)) allData = allData.concat(res.data);
                        });
                        groupedData = processETAData(allData, now, appConfig.company);

                    } else {
                        // 九巴一次性請求該站所有 ETA
                        let url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${appConfig.stopId}`;
                        const response = await fetch(url);
                        if (!response.ok) throw new Error('API Error');
                        const json = await response.json();
                        const rawData = (json && Array.isArray(json.data)) ? json.data : [];
                        groupedData = processETAData(rawData, now, appConfig.company);
                    }
                    
                    renderETACards(groupedData, appConfig.company);

                    lastUpdateTime.textContent = now.toLocaleTimeString('zh-HK', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
                    statusIndicator.classList.replace('bg-yellow-500', 'bg-green-500');
                } catch (error) {
                    console.error('ETA Fetch Error:', error);
                    etaList.innerHTML = `<div class="p-4 bg-red-900/30 border border-red-800 rounded-xl text-center text-red-400">無法獲取實時數據，請稍後再試。</div>`;
                    statusIndicator.classList.replace('bg-yellow-500', 'bg-red-500');
                } finally {
                    mainLoader.classList.add('hidden');
                    timeRemaining = 30;
                    countdownText.textContent = `${timeRemaining}s`;
                }
            }

            function processETAData(data, currentTime, company) {
                const groups = {};
                
                appConfig.routes.forEach(conf => {
                    const key = `${conf.route}-${conf.dir || ''}`;
                    groups[key] = { route: conf.route, dest: conf.dest, dir: conf.dir, buses: [] };
                });

                data.forEach(item => {
                    if (!item.eta) return;
                    
                    // 修正：標準化城巴 API 的方向參數與我們設定的匹配
                    let itemDir = item.dir || '';
                    if (company === 'CTB') {
                        if (itemDir === 'O') itemDir = 'outbound';
                        if (itemDir === 'I') itemDir = 'inbound';
                    }
                    
                    const key = `${item.route}-${itemDir}`;
                    
                    if (groups[key]) {
                        const etaTime = new Date(item.eta);
                        const diffMs = etaTime - currentTime;
                        let minutes = Math.floor(diffMs / 60000);
                        
                        if (minutes > -5) {
                            groups[key].buses.push({ minutes, rmk: item.rmk_tc || item.rmk_en || '' });
                        }
                    }
                });

                return Object.values(groups).map(g => {
                    g.buses.sort((a, b) => a.minutes - b.minutes);
                    g.buses = g.buses.slice(0, 3);
                    return g;
                });
            }

            function processETADataMTR(results, config, currentTime) {
                const groups = [];
                config.routes.forEach(conf => {
                    const lineInfo = MTR_LINE_INFO[conf.route];
                    const group = { route: conf.route, routeName: lineInfo ? lineInfo.n : conf.route, dest: conf.dest, dir: conf.dir, color: lineInfo ? lineInfo.c : '', buses: [] };
                    
                    results.forEach(res => {
                        if (res && res.status === 1 && res.data) {
                            const key = `${conf.route}-${config.stopId}`;
                            if (res.data[key] && res.data[key][conf.dir]) {
                                res.data[key][conf.dir].forEach(t => {
                                    if (t.valid === 'Y') {
                                        let mins = parseInt(t.ttnt);
                                        if (isNaN(mins)) mins = Math.floor((new Date(t.time.replace(' ', 'T')) - currentTime) / 60000);
                                        if (mins > -5) group.buses.push({ minutes: mins, plat: t.plat, destName: getMTRStationName(t.dest) });
                                    }
                                });
                            }
                        } else if (res && res.status === 0) {
                            group.buses.push({ minutes: -1, isError: true, rmk: '⚠️ 港鐵尚未開放此路綫的實時數據' });
                        }
                    });
                    
                    if (group.buses.length > 0 && group.buses[0].isError) group.buses = [group.buses[0]];
                    else {
                        group.buses.sort((a, b) => a.minutes - b.minutes);
                        group.buses = group.buses.slice(0, 4);
                    }
                    groups.push(group);
                });
                return groups;
            }

            function renderETACards(groupedData, company) {
                etaList.innerHTML = '';
                if (groupedData.length === 0) {
                    etaList.innerHTML = `<div class="p-4 text-center text-gray-500">沒有符合的路線資料。</div>`; return;
                }

                const dotColorClass = company === 'KMB' ? 'bg-kmbRed' : (company === 'CTB' ? 'bg-ctbYellow' : 'bg-mtrRed');
                const headerColorClass = company === 'KMB' ? 'bg-red-900/20 border-red-900/50' : (company === 'MTR' ? 'bg-red-950 border-red-900/50' : 'bg-yellow-900/20 border-yellow-900/50');

                groupedData.forEach(group => {
                    const card = document.createElement('div');
                    card.className = 'bg-cardbg rounded-xl border border-gray-700/50 overflow-hidden shadow-lg shrink-0';
                    let routeLabel = company === 'MTR' ? (group.routeName || group.route) : group.route;
                    let routeStyle = company === 'MTR' ? `text-white` : `bg-white text-black`;

                    card.innerHTML = `
                        <div class="px-4 py-3 ${headerColorClass} border-b flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="${routeStyle} font-black text-xl px-2 py-0.5 rounded min-w-[3.5rem] text-center shadow" style="${company === 'MTR' ? `background-color:${group.color}` : ''}">${routeLabel}</span>
                                <div class="flex flex-col">
                                    <span class="text-[10px] text-gray-400 uppercase tracking-widest">${company} 往</span>
                                    <span class="text-white font-bold tracking-wide">${group.dest}</span>
                                </div>
                            </div>
                        </div>
                        <ul class="divide-y divide-gray-800 relative">
                            ${group.buses.length === 0 ? '<li class="px-4 py-6 text-center text-sm text-gray-500">暫無班次資料或服務已暫停</li>' : 
                                group.buses.map((bus, index) => {
                                    if (bus.isError) return `<li class="px-4 py-4 flex justify-center items-center"><span class="text-sm text-yellow-500 font-medium">${bus.rmk}</span></li>`;
                                    
                                    const isUrgent = bus.minutes <= 2;
                                    let timeText = bus.minutes <= 0 ? '即將到站' : `${bus.minutes} 分鐘`;
                                    let timeColorClass = isUrgent ? (company === 'MTR' ? 'text-red-400 font-bold' : (company === 'KMB' ? 'text-kmbRed font-bold' : 'text-ctbYellow font-bold')) : 'text-white';
                                    const rmkHtml = bus.rmk ? `<span class="text-[10px] bg-gray-700 text-gray-300 px-1.5 py-0.5 rounded ml-2">${bus.rmk}</span>` : '';
                                    const platHtml = bus.plat ? `<span class="text-[10px] border border-gray-600 text-gray-400 px-1.5 py-0.5 rounded ml-2">月台 ${bus.plat}</span>` : '';
                                    const destHtml = company === 'MTR' && bus.destName && bus.destName !== group.dest ? `<span class="text-[10px] bg-gray-800 text-gray-300 px-1.5 py-0.5 rounded ml-2">往 ${bus.destName}</span>` : '';
                                    const dotClass = index === 0 && isUrgent ? (company === 'MTR' ? 'bg-red-500' : dotColorClass) : (index === 0 ? 'bg-green-500' : 'bg-gray-600');

                                    return `
                                        <li class="px-4 py-3 flex justify-between items-center">
                                            <div class="flex items-center gap-3">
                                                <div class="flex flex-col items-center justify-center w-6">
                                                    <div class="w-2 h-2 rounded-full ${dotClass} shadow-[0_0_5px_rgba(255,255,255,0.3)]"></div>
                                                    ${index < group.buses.length - 1 ? '<div class="w-[1px] h-6 bg-gray-700 absolute mt-8"></div>' : ''}
                                                </div>
                                                <span class="text-sm text-gray-400 font-mono">班次 ${index + 1} ${rmkHtml} ${platHtml} ${destHtml}</span>
                                            </div>
                                            <div class="${timeColorClass} tracking-wide text-right text-lg">${timeText}</div>
                                        </li>
                                    `;
                                }).join('')
                            }
                        </ul>
                    `;
                    etaList.appendChild(card);
                });
            }

            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);
                timeRemaining = 30;
                countdownText.textContent = `${timeRemaining}s`;
                timerInterval = setInterval(() => {
                    timeRemaining--;
                    if (timeRemaining <= 0) loadETA();
                    else countdownText.textContent = `${timeRemaining}s`;
                }, 1000);
            }

            searchBtn.addEventListener('click', () => {
                searchStops(stopNameSearch.value.trim());
            });

            stopNameSearch.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchStops(stopNameSearch.value.trim());
            });

            refreshBtn.addEventListener('click', () => { loadETA(); startTimer(); });

            toggleSettingsBtn.addEventListener('click', () => {
                if (viewSettings.classList.contains('hidden')) showView('settings');
                else {
                    if (appConfig.stopId) showView('eta');
                    else showToast('請先選擇並儲存站點路線！');
                }
            });

            document.getElementById('go-to-settings-btn').addEventListener('click', () => showView('settings'));

            init();
        });
    </script>
</body>
</html>
